    <!-- Filters. data-filter must match a value used in data-tags below ("all" shows everything). -->
    <div class="filters" role="group" aria-label="Filter illustrations">
      <button type="button" data-filter="all" aria-pressed="true">All</button>
      <button type="button" data-filter="book-illustration" aria-pressed="false">Book illustration</button>
      <button type="button" data-filter="portraits" aria-pressed="false">Portraits</button>
    </div>

    <!--
      HOW TO ADD A PIECE
      Copy one block below, paste it where you want it in the mosaic, and change:
        - data-tags       the tag(s) of the piece, separated by spaces
        - href            the full-size image (made by tools/build-images.sh)
        - data-caption    the short caption shown in the lightbox
        - src, alt        the thumbnail and its description
        - width, height   the thumbnail size in pixels (the script prints it)
        - .description    optional longer text (one or two paragraphs, plain HTML). In the lightbox it
                          appears beside the image, and over the bottom of the image on phones.
                          Delete the whole div if the piece does not need one.

      A book illustration has a second link (class="spread") with the book spread. It has no
      image inside: it is hidden in the mosaic and shown as the next slide in the lightbox.
      Pieces with a spread get a small "two pages" icon in the mosaic and a hover tooltip
      automatically.

      SHAREABLE LINKS
      Every slide has a link made from its image file name: index.html#portrait-03 opens that
      piece, and index.html#book-03-spread opens its book spread. Nothing to configure.
    -->
    <div class="mosaic" id="mosaic">
