        <li class="piece" data-type="fiction">
          <a class="piece__link" href="img/fiction/tagore_luna_1.webp">
            <img src="img/fiction/tagore_luna_1.webp" alt="I. The Home, The Crescent Moon by Rabindranath Tagore" width="1270" height="1800" loading="lazy">
          </a>
          <template>
            <img class="detail__spread" src="img/fiction/tagore_luna_book-1.webp" alt="Book spread with the illustration" width="1800" height="1277">
            <p class="detail__meta">The Crescent Moon by Rabindranath Tagore</p>
            <h3 class="detail__title">I. The Home</h3>
            <p class="detail__text">I paced alone on the road across the field while the sunset was hiding its last gold like a miser.</p>
            <p class="detail__text">The daylight sank deeper and deeper into the darkness, and the widowed land, whose harvest had been reaped, lay silent.</p>
            <p class="detail__text">Suddenly a boy's shrill voice rose into the sky. He traversed the dark unseen, leaving the track of his song across the hush of the evening.</p>
            <p class="detail__text">His village home lay there at the end of the waste land, beyond the sugar-cane field, hidden among the shadows of the banana and the slender areca palm, the cocoa-nut and the dark green jack-fruit trees.</p>
            <p class="detail__text">I stopped for a moment in my lonely way under the starlight, and saw spread before me the darkened earth surrounding with her arms countless homes furnished with cradles and beds, mothers' hearts and evening lamps, and young lives glad with a gladness that knows nothing of its value for the world.</p>
          </template>
        </li>

        <li class="piece" data-type="fiction">
          <a class="piece__link" href="img/fiction/tagore_luna_12.webp">
            <img src="img/fiction/tagore_luna_12.webp" alt="XII. Playthings, The Crescent Moon by Rabindranath Tagore" width="1270" height="1800" loading="lazy">
          </a>
          <template>
            <img class="detail__spread" src="img/fiction/tagore_luna_book-12.webp" alt="Book spread with the illustration" width="1800" height="1277">
            <p class="detail__meta">The Crescent Moon by Rabindranath Tagore</p>
            <h3 class="detail__title">XII. Playthings</h3>
            <p class="detail__text">Child, how happy you are sitting in the dust, playing with a broken twig all the morning.</p>
            <p class="detail__text">I smile at your play with that little bit of a broken twig.</p>
            <p class="detail__text">I am busy with my accounts, adding up figures by the hour.</p>
            <p class="detail__text">Perhaps you glance at me and think, "What a stupid game to spoil your morning with!"</p>
            <p class="detail__text">Child, I have forgotten the art of being absorbed in sticks and mud-pies.</p>
            <p class="detail__text">I seek out costly playthings, and gather lumps of gold and silver.</p>
            <p class="detail__text">With whatever you find you create your glad games, I spend both my time and my strength over things I never can obtain.</p>
            <p class="detail__text">In my frail canoe I struggle to cross the sea of desire, and forget that I too am playing a game.</p>
          </template>
        </li>

        <li class="piece" data-type="fiction">
          <a class="piece__link" href="img/fiction/tagore_luna_16.webp">
            <img src="img/fiction/tagore_luna_16.webp" alt="XVI. Fairyland, The Crescent Moon by Rabindranath Tagore" width="1270" height="1800" loading="lazy">
          </a>
          <template>
            <img class="detail__spread" src="img/fiction/tagore_luna_book-16.webp" alt="Book spread with the illustration" width="1800" height="1277">
            <p class="detail__meta">The Crescent Moon by Rabindranath Tagore</p>
            <h3 class="detail__title">XVI. Fairyland</h3>
            <p class="detail__text">If people came to know where my king's palace is, it would vanish into the air.</p>
            <p class="detail__text">The walls are of white silver and the roof of shining gold.</p>
            <p class="detail__text">The queen lives in a palace with seven courtyards, and she wears a jewel that cost all the wealth of seven kingdoms.</p>
            <p class="detail__text">But let me tell you, mother, in a whisper, where my king's palace is.</p>
            <p class="detail__text">It is at the corner of our terrace where the pot of the tulsi plant stands.</p>
            <p class="detail__text">The princess lies sleeping on the far-away shore of the seven impassable seas.</p>
            <p class="detail__text">There is none in the world who can find her but myself.</p>
            <p class="detail__text">She has bracelets on her arms and pearl drops in her ears; her hair sweeps down upon the floor.</p>
            <p class="detail__text">She will wake when I touch her with my magic wand, and jewels will fall from her lips when she smiles.</p>
            <p class="detail__text">But let me whisper in your ear, mother; she is there in the corner of our terrace where the pot of the tulsi plant stands.</p>
            <p class="detail__text">When it is time for you to go to the river for your bath, step up to that terrace on the roof.</p>
            <p class="detail__text">I sit in the corner where the shadows of the walls meet together.</p>
            <p class="detail__text">Only puss is allowed to come with me, for she knows where the barber in the story lives.</p>
            <p class="detail__text">But let me whisper, mother, in your ear where the barber in the story lives.</p>
            <p class="detail__text">It is at the corner of the terrace where the pot of the tulsi plant stands.</p>
          </template>
        </li>

        <li class="piece" data-type="fiction">
          <a class="piece__link" href="img/fiction/tagore_luna_18.webp">
            <img src="img/fiction/tagore_luna_18.webp" alt="XVIII. The Rainy Day, The Crescent Moon by Rabindranath Tagore" width="1270" height="1800" loading="lazy">
          </a>
          <template>
            <img class="detail__spread" src="img/fiction/tagore_luna_book-18.webp" alt="Book spread with the illustration" width="1800" height="1277">
            <p class="detail__meta">The Crescent Moon by Rabindranath Tagore</p>
            <h3 class="detail__title">XVIII. The Rainy Day</h3>
            <p class="detail__text">Sullen clouds are gathering fast over the black fringe of the forest.</p>
            <p class="detail__text">O child, do not go out!</p>
            <p class="detail__text">The palm trees in a row by the lake are smiting their heads against the dismal sky; the crows with their draggled wings are silent on the tamarind branches, and the eastern bank of the river is haunted by a deepening gloom.</p>
            <p class="detail__text">Our cow is lowing loud, tied at the fence.</p>
            <p class="detail__text">O child, wait here till I bring her into the stall.</p>
            <p class="detail__text">Men have crowded into the flooded field to catch the fishes as they escape from the overflowing ponds; the rain water is running in rills through the narrow lanes like a laughing boy who has run away from his mother to tease her.</p>
            <p class="detail__text">Listen, someone is shouting for the boatman at the ford.</p>
            <p class="detail__text">O child, the daylight is dim, and the crossing at the ferry is closed.</p>
            <p class="detail__text">The sky seems to ride fast upon the madly-rushing rain; the water in the river is loud and impatient; women have hastened home early from the Ganges with their filled pitchers.</p>
            <p class="detail__text">The evening lamps must be made ready.</p>
            <p class="detail__text">O child, do not go out!</p>
            <p class="detail__text">The road to the market is desolate, the lane to the river is slippery. The wind is roaring and struggling among the bamboo branches like a wild beast tangled in a net.</p>
          </template>
        </li>

        <li class="piece" data-type="fiction">
          <a class="piece__link" href="img/fiction/tagore_luna_19.webp">
            <img src="img/fiction/tagore_luna_19.webp" alt="XIX. Paper Boats, The Crescent Moon by Rabindranath Tagore" width="1270" height="1800" loading="lazy">
          </a>
          <template>
            <img class="detail__spread" src="img/fiction/tagore_luna_book-19.webp" alt="Book spread with the illustration" width="1800" height="1277">
            <p class="detail__meta">The Crescent Moon by Rabindranath Tagore</p>
            <h3 class="detail__title">XIX. Paper Boats</h3>
            <p class="detail__text">Day by day I float my paper boats one by one down the running stream.</p>
            <p class="detail__text">In big black letters I write my name on them and the name of the village where I live.</p>
            <p class="detail__text">I hope that someone in some strange land will find them and know who I am.</p>
            <p class="detail__text">I load my little boats with shiuli flowers from our garden, and hope that these blooms of the dawn will be carried safely to land in the night.</p>
            <p class="detail__text">I launch my paper boats and look up into the sky and see the little clouds setting their white bulging sails.</p>
            <p class="detail__text">I know not what playmate of mine in the sky sends them down the air to race with my boats!</p>
            <p class="detail__text">When night comes I bury my face in my arms and dream that my paper boats float on and on under the midnight stars.</p>
            <p class="detail__text">The fairies of sleep are sailing in them, and the lading is their baskets full of dreams.</p>
          </template>
        </li>

        <li class="piece" data-type="fiction">
          <a class="piece__link" href="img/fiction/tagore_luna_23.webp">
            <img src="img/fiction/tagore_luna_23.webp" alt="XXIII. The Merchant, The Crescent Moon by Rabindranath Tagore" width="1270" height="1800" loading="lazy">
          </a>
          <template>
            <img class="detail__spread" src="img/fiction/tagore_luna_book-23.webp" alt="Book spread with the illustration" width="1800" height="1277">
            <p class="detail__meta">The Crescent Moon by Rabindranath Tagore</p>
            <h3 class="detail__title">XXIII. The Merchant</h3>
            <p class="detail__text">Imagine, mother, that you are to stay at home and I am to travel into strange lands.</p>
            <p class="detail__text">Imagine that my boat is ready at the landing fully laden.</p>
            <p class="detail__text">Now think well, mother, before you say what I shall bring for you when I come back.</p>
            <p class="detail__text">Mother, do you want heaps and heaps of gold?</p>
            <p class="detail__text">There, by the banks of golden streams, fields are full of golden harvest.</p>
            <p class="detail__text">And in the shade of the forest path the golden champa flowers drop on the ground.</p>
            <p class="detail__text">I will gather them all for you in many hundred baskets.</p>
            <p class="detail__text">Mother, do you want pearls big as the raindrops of autumn?</p>
            <p class="detail__text">I shall cross to the pearl island shore. There in the early morning light pearls tremble on the meadow flowers, pearls drop on the grass, and pearls are scattered on the sand in spray by the wild sea-waves.</p>
            <p class="detail__text">My brother shall have a pair of horses with wings to fly among the clouds.</p>
            <p class="detail__text">For father I shall bring a magic pen that, without his knowing, will write of itself.</p>
            <p class="detail__text">For you, mother, I must have the casket and jewel that cost seven kings their kingdoms.</p>
          </template>
        </li>
