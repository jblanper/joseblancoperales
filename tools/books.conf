# The spread is made of the left page and the page after it (page 2 -> pages 2 and 3)
# and saved as images/spreads/<output name>.webp. Use the same name as the illustration
# in originals/ so the files are easy to match. Avoid spaces in file names.
# Page numbers count from 1 as in a PDF viewer, not as printed in the book.

